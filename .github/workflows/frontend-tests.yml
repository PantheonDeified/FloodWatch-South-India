name: Validate FloodWatch frontend JavaScript

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/validate_frontend_js.py'
      - 'scripts/test_calculated_risk_grid.js'
      - 'data/south-india-states.geojson'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/validate_frontend_js.py'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-js:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax-check inline frontend JavaScript
        run: python scripts/validate_frontend_js.py
      - name: Regression-test calculated grid geometry and scoring
        run: node scripts/test_calculated_risk_grid.js
