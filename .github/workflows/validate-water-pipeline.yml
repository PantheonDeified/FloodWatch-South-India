name: Validate water-data pipeline

on:
  push:
    paths:
      - 'data_pipeline/**/*.py'
      - 'data_pipeline/**/*.json'
      - '.github/workflows/validate-water-pipeline.yml'
  pull_request:
    paths:
      - 'data_pipeline/**/*.py'
      - 'data_pipeline/**/*.json'
      - '.github/workflows/validate-water-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lightweight data-pipeline test dependency
        run: python -m pip install "pandas>=2.1,<3"
      - name: Run water-pipeline unit tests
        run: python -m unittest discover -s data_pipeline/tests -p "test_*.py"
      - name: Syntax-check ML and neural-network scripts without installing ML dependencies
        run: python -m py_compile data_pipeline/scripts/train_streamflow_lstm.py data_pipeline/scripts/predict_streamflow_lstm.py data_pipeline/scripts/train_event_ml.py data_pipeline/scripts/build_event_features.py data_pipeline/scripts/assess_streamflow_readiness.py data_pipeline/scripts/download_nwdp_history.py data_pipeline/scripts/inspect_nwdp_archive.py data_pipeline/scripts/review_streamflow_model.py
      - name: Validate committed snapshot
        run: python data_pipeline/scripts/validate_water_snapshot.py --snapshot data/water-observations.json
      - name: Generate audit report and ensure report generation works
        run: python data_pipeline/scripts/audit_water_snapshot.py --snapshot data/water-observations.json --out /tmp/water-pipeline-report.md
