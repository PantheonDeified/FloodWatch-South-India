name: Refresh official water observations

on:
  push:
    paths:
      - 'data_pipeline/**'
      - 'data/water-observations.json'
      - '.github/workflows/refresh-water-observations.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-official-water-observations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public-feed collector dependencies
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Fetch current-period public observations
        run: python data_pipeline/scripts/refresh_water_observations.py --sources data_pipeline/sources.json --out data/water-observations.json --max-resources 40
      - name: Validate JSON and summarize output
        run: |
          python -m json.tool data/water-observations.json > /dev/null
          python - <<'PY'
          import json
          with open("data/water-observations.json", encoding="utf-8") as handle:
              data = json.load(handle)
          print("observations:", data.get("observation_count"))
          print("resources checked:", data.get("resource_count_checked"))
          print("generated at:", data.get("generated_at_utc"))
          if not isinstance(data.get("observations"), list):
              raise SystemExit("Invalid observation list")
          PY
      - name: Publish changed snapshot to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water-observations.json
          if git diff --cached --quiet; then
            echo "No data snapshot changes to publish."
          else
            git commit -m "Refresh public water observations"
            # Rebase the generated snapshot commit on top of any code/docs commits
            # that arrived while public resources were downloading.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
