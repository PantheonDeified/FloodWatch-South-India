name: Refresh official water observations

on:
  push:
    paths:
      - 'data_pipeline/sources.json'
      - 'data_pipeline/requirements.txt'
      - 'data_pipeline/scripts/refresh_water_observations.py'
      - 'data_pipeline/scripts/validate_water_snapshot.py'
      - 'data_pipeline/scripts/audit_water_snapshot.py'
      - 'data_pipeline/tests/test_validate_water_snapshot.py'
      - 'data_pipeline/tests/test_audit_water_snapshot.py'
      - '.github/workflows/refresh-water-observations.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-official-water-observations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public-feed collector dependencies
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pandas>=2.1,<3"
      - name: Test snapshot validator
        run: python -m unittest discover -s data_pipeline/tests -p "test_*.py"
      - name: Fetch current-period public observations
        run: python data_pipeline/scripts/refresh_water_observations.py --sources data_pipeline/sources.json --out data/water-observations.json --max-resources 40
      - name: Validate snapshot structure and data quality
        run: |
          python -m json.tool data/water-observations.json > /dev/null
          python data_pipeline/scripts/validate_water_snapshot.py --snapshot data/water-observations.json
      - name: Generate water data quality report
        run: python data_pipeline/scripts/audit_water_snapshot.py --snapshot data/water-observations.json --out docs/water-pipeline-report.md
      - name: Publish changed snapshot to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water-observations.json docs/water-pipeline-report.md
          if git diff --cached --quiet; then
            echo "No data snapshot changes to publish."
          else
            git commit -m "Refresh public water observations"
            # Rebase the generated snapshot commit on top of any code/docs commits
            # that arrived while public resources were downloading.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
