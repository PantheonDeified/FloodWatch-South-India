name: Train FloodWatch discharge LSTM

on:
  # One-time bootstrap: automatically run when this workflow itself is first configured/updated.
  push:
    paths:
      - '.github/workflows/train-discharge-lstm.yml'
  workflow_dispatch:
    inputs:
      station_id:
        description: "Exact station ID from the CWC normalized dataset"
        required: true
        default: "karnataka|yadgir|16.73750000|77.12527778"
        type: string
      lookback_days:
        description: "Past daily discharge values used by the model"
        required: true
        default: "90"
        type: string
      lead_days:
        description: "Number of future daily discharge values to predict"
        required: true
        default: "7"
        type: string
      epochs:
        description: "Maximum training epochs"
        required: true
        default: "80"
        type: string

permissions:
  contents: read

concurrency:
  group: floodwatch-discharge-lstm
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "torch>=2.2" requests beautifulsoup4

      - name: Download official CWC/NWDP historical discharge archives
        run: |
          python data_pipeline/scripts/download_nwdp_history.py \
            --out-dir data_pipeline/raw/nwdp_history \
            --keywords "river discharge" \
            --start-year 1950 \
            --end-year 2025 \
            --max-resources 50

      - name: Normalize source observations and preserve provenance
        run: |
          python data_pipeline/scripts/normalize_cwc_discharge.py \
            --input-dir data_pipeline/raw/nwdp_history \
            --output data_pipeline/output/cwc_discharge_normalized.csv \
            --report data_pipeline/output/cwc_discharge_quality_report.json

      - name: Train and evaluate neural network
        run: |
          python data_pipeline/scripts/train_discharge_lstm.py \
            --observations data_pipeline/output/cwc_discharge_normalized.csv \
            --station-id "${{ inputs.station_id }}" \
            --output-dir data_pipeline/output/models \
            --lookback-days "${{ inputs.lookback_days }}" \
            --lead-days "${{ inputs.lead_days }}" \
            --epochs "${{ inputs.epochs }}"

      - name: Upload model, metrics, and source-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floodwatch-discharge-lstm-${{ github.run_number }}
          path: |
            data_pipeline/output/models/
            data_pipeline/output/cwc_discharge_quality_report.json
          if-no-files-found: warn
          retention-days: 14
