name: Train FloodWatch regional discharge LSTM

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/train-regional-lstm.yml'
      - 'data_pipeline/scripts/train_regional_lstm.py'
      - 'data_pipeline/scripts/predict_regional_lstm.py'
      - 'data_pipeline/scripts/normalize_cwc_discharge.py'
      - 'data_pipeline/scripts/download_nwdp_history.py'

permissions:
  contents: read

concurrency:
  group: floodwatch-regional-discharge-lstm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regional-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ML and data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" requests beautifulsoup4
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==2.10.0+cpu"
      - name: Define same-day source cache key
        id: source-cache-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache normalized CWC/NWDP training data
        id: nwdp-cache
        uses: actions/cache@v4
        with:
          path: |
            data_pipeline/raw/nwdp_history/
            data_pipeline/output/cwc_discharge_normalized.csv
            data_pipeline/output/cwc_discharge_quality_report.json
          key: floodwatch-nwdp-v2-${{ runner.os }}-${{ hashFiles('data_pipeline/scripts/download_nwdp_history.py', 'data_pipeline/scripts/normalize_cwc_discharge.py') }}-${{ steps.source-cache-day.outputs.day }}
          restore-keys: |
            floodwatch-nwdp-v2-${{ runner.os }}-${{ hashFiles('data_pipeline/scripts/download_nwdp_history.py', 'data_pipeline/scripts/normalize_cwc_discharge.py') }}-
      - name: Download official CWC/NWDP discharge archives
        if: steps.nwdp-cache.outputs.cache-hit != 'true'
        run: |
          # A restored previous-day cache is a warm start only; do not mix it with today's downloads.
          rm -rf data_pipeline/raw/nwdp_history
          mkdir -p data_pipeline/raw/nwdp_history
          python data_pipeline/scripts/download_nwdp_history.py --out-dir data_pipeline/raw/nwdp_history --keywords "river discharge" --start-year 1950 --end-year 2025 --max-resources 50
      - name: Normalize source observations
        if: steps.nwdp-cache.outputs.cache-hit != 'true'
        run: |
          python data_pipeline/scripts/normalize_cwc_discharge.py --input-dir data_pipeline/raw/nwdp_history --output data_pipeline/output/cwc_discharge_normalized.csv --report data_pipeline/output/cwc_discharge_quality_report.json
      - name: Train regional multi-station LSTM
        run: |
          python data_pipeline/scripts/train_regional_lstm.py --observations data_pipeline/output/cwc_discharge_normalized.csv --output-dir data_pipeline/output/regional_models --lookback-days 90 --lead-days 7 --window-stride 14 --epochs 6 --patience 2 --max-windows-per-station-split 70 --hidden-size 48 --num-layers 1 --batch-size 512
      - name: Run inference smoke test with saved weights and scalers
        run: |
          python data_pipeline/scripts/predict_regional_lstm.py --observations data_pipeline/output/cwc_discharge_normalized.csv --model-file data_pipeline/output/regional_models/regional_discharge_lstm.pt --scalers-file data_pipeline/output/regional_models/regional_discharge_lstm.scalers.json --report-file data_pipeline/output/regional_models/regional_discharge_lstm.report.json --output-file data_pipeline/output/regional_models/latest_forecast_research.json --lookback-days 90
      - name: Upload data, model, inference output, and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floodwatch-regional-lstm
          path: |
            data_pipeline/output/regional_models/
            data_pipeline/output/cwc_discharge_quality_report.json
          if-no-files-found: warn
          retention-days: 90
