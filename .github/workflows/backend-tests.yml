name: Test FloodWatch backend

on:
  push:
    paths:
      - 'backend/**'
      - 'deploy/ibm-linuxone/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile the API
        run: python -m py_compile backend/main.py
      - name: Validate IBM LinuxONE installer and regional-ML runner shell syntax
        run: |
          bash -n deploy/ibm-linuxone/install-user-service.sh
          bash -n deploy/ibm-linuxone/run-regional-lstm.sh
          bash deploy/ibm-linuxone/run-regional-lstm.sh --help
      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t floodwatch-api:ci .
      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q tests
