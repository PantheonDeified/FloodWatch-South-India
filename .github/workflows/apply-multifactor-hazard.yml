name: Apply verified multi-factor hazard scoring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch implementation
        shell: python
        run: |
          from pathlib import Path

          bp=Path('backend/main.py')
          bs=bp.read_text(encoding='utf-8')
          bs=bs.replace('APP_VERSION = "0.5.0"','APP_VERSION = "0.6.0"',1)
          marker='@app.get("/api/v1/river-flow")'
          if 'def reservoir_status(' not in bs:
              endpoint='''\n\ndef _number_from_record(row: dict, *keys):\n    for key in keys:\n        try:\n            value=float(row.get(key))\n        except (TypeError, ValueError):\n            continue\n        if math.isfinite(value):\n            return value\n    return None\n\ndef _reservoir_storage_pct(row: dict):\n    direct=_number_from_record(row,"storage_pct","storage_percent","percent_full","live_storage_pct","live_storage_percent","capacity_pct","capacity_percent")\n    if direct is not None and 0 <= direct <= 100:\n        return direct\n    live=_number_from_record(row,"live_storage","live_storage_bcm","storage")\n    capacity=_number_from_record(row,"live_storage_capacity","live_capacity","capacity")\n    if live is not None and capacity is not None and capacity > 0:\n        pct=100.0*live/capacity\n        if 0 <= pct <= 120:\n            return max(0.0,min(100.0,pct))\n    return None\n\n@app.get("/api/v1/reservoir-status")\ndef reservoir_status(latitude: float=Query(...,ge=7.0,le=21.8), longitude: float=Query(...,ge=73.0,le=87.0)):\n    snapshot=load_water_snapshot()\n    candidates=[]\n    for row in snapshot.get("observations",[]):\n        if not isinstance(row,dict): continue\n        kind=" ".join(str(row.get(k) or "") for k in ("kind","station_name","asset_type","metric"))\n        if not any(term in kind.casefold() for term in ("reservoir","dam","storage")): continue\n        try: rlat,rlon=float(row.get("latitude")),float(row.get("longitude"))\n        except (TypeError,ValueError): continue\n        storage_pct=_reservoir_storage_pct(row)\n        if storage_pct is None: continue\n        lat1,lat2=math.radians(latitude),math.radians(rlat)\n        dlat,dlon=lat2-lat1,math.radians(rlon-longitude)\n        a=math.sin(dlat/2)**2+math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2\n        distance_km=6371.0*2*math.atan2(math.sqrt(min(1.0,a)),math.sqrt(max(0.0,1.0-a)))\n        candidates.append((distance_km,row,storage_pct))\n    if not candidates:\n        return {"available":False,"storage_pct":None,"distance_km":None,"source":"CWC/NWIC published water-observation snapshot","reason":"No reservoir record with a usable storage percentage was found near this location."}\n    distance_km,row,storage_pct=min(candidates,key=lambda item:item[0])\n    return {"available":True,"storage_pct":round(storage_pct,2),"distance_km":round(distance_km,2),"reservoir_name":row.get("station_name") or row.get("reservoir_name") or row.get("name"),"observed_at":row.get("observed_at") or row.get("observed_at_raw"),"source":row.get("source_name") or "CWC/NWIC published water-observation snapshot","source_url":row.get("source_url"),"stress_score":round(max(0.0,min(1.0,(storage_pct-50.0)/50.0)),4),"not_a_dam_safety_rating":True}\n'''
              if marker not in bs: raise SystemExit('river-flow marker missing')
              bs=bs.replace(marker,endpoint+'\n'+marker,1)
          old='''    payload["_floodwatch"] = {\n        "backend_version": APP_VERSION,\n        "provider": "Open-Meteo Flood API / GloFAS",\n        "fetched_at_utc": datetime.now(timezone.utc).isoformat(),'''
          new='''    reservoir_context=reservoir_status(latitude=latitude,longitude=longitude)\n    payload["_floodwatch"] = {\n        "backend_version": APP_VERSION,\n        "provider": "Open-Meteo Flood API / GloFAS",\n        "fetched_at_utc": datetime.now(timezone.utc).isoformat(),\n        "reservoir": reservoir_context,'''
          if old not in bs: raise SystemExit('river response marker missing')
          bs=bs.replace(old,new,1)
          bp.write_text(bs,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('function score(b){'); end=s.find('let pin=null,token=0;',start)
          if start<0 or end<0: raise SystemExit('score boundaries missing')
          new_score='''function calculateFloodHazardScore(rainfall24hMm,riverPercentile,damStoragePct){\n  const rainScore=clamp(rainfall24hMm/200);\n  const riverScore=Number.isFinite(riverPercentile)?clamp(riverPercentile/100):null;\n  const damScore=Number.isFinite(damStoragePct)?clamp((damStoragePct-50)/50):null;\n  let composite,weights;\n  if(riverScore!=null&&damScore!=null){composite=.40*rainScore+.35*riverScore+.25*damScore;weights='40% rainfall + 35% river + 25% reservoir';}\n  else if(riverScore!=null){composite=(.40*rainScore+.35*riverScore)/.75;weights='57% rainfall + 43% river (reservoir unavailable; weights renormalized)';}\n  else{composite=rainScore;weights='100% rainfall (river and reservoir unavailable)';}\n  return {score:100*clamp(composite),rainScore,riverScore,damScore,weights};\n}\n\nfunction score(b){\n  const h=b.w.hourly||{},times=h.time||[],cutoff=Date.now()-30*60*1000;\n  const idx=times.map((t,i)=>[i,Date.parse(t+'Z')]).filter(x=>x[1]>=cutoff).map(x=>x[0]);\n  const rain=i=>+h.precipitation?.[i]||0;\n  const r24=idx.slice(0,24).reduce((s,i)=>s+rain(i),0),r72=idx.slice(0,72).reduce((s,i)=>s+rain(i),0);\n  const pr=Math.max(0,...idx.slice(0,24).map(i=>+h.precipitation_probability?.[i]||0));\n  const cur=+b.w.current?.precipitation||0;\n  if(idx.length<24)return {level:'unk',score:null,hours:[]};\n  let pct=null,peak=null; const d=b.f?.daily;\n  if(d&&d.time){const today=new Date().toISOString().slice(0,10),hist=[],fut=[];d.time.forEach((t,i)=>{const v=d.river_discharge[i];if(v==null)return;if(t<today)hist.push(v);else if(t>today)fut.push(v)});if(hist.length>=20&&fut.length){peak=Math.max(...fut.slice(0,7));const lo=hist.filter(v=>v<peak).length,eq=hist.filter(v=>v===peak).length;pct=100*(lo+eq/2)/hist.length;}}\n  const reservoir=b.f?._floodwatch?.reservoir||null;\n  const damStoragePct=Number.isFinite(Number(reservoir?.storage_pct))?Number(reservoir.storage_pct):null;\n  const hazard=calculateFloodHazardScore(r24,pct,damStoragePct);\n  const s=hazard.score,level=s>=70?'red':s>=45?'amber':'green';\n  return {level,score:s,r24,r72,pr,cur,pct,peak,damStoragePct,riverScore:hazard.riverScore,damScore:hazard.damScore,weights:hazard.weights,reservoir,hours:idx.slice(0,24).map(rain)};\n}\n\n'''
          s=s[:start]+new_score+s[end:]
          old_render="""  if(r.score!=null){\n    why.push('🌧️ '+r.r24.toFixed(0)+' mm of rain expected in 24 hours');\n    why.push('📅 '+r.r72.toFixed(0)+' mm over the next 72 hours');\n    why.push('☔ Up to '+Math.round(r.pr)+'% chance of rain');\n  }"""
          new_render="""  if(r.score!=null){\n    why.push('🌧️ '+r.r24.toFixed(0)+' mm of rain expected in 24 hours');\n    why.push('📅 '+r.r72.toFixed(0)+' mm over the next 72 hours');\n    why.push('☔ Up to '+Math.round(r.pr)+'% chance of rain');\n    why.push(r.pct!=null?'🏞️ River factor: '+Math.round(r.pct)+'th percentile':'🏞️ River factor: unavailable here');\n    why.push(r.damStoragePct!=null?'🏗️ Reservoir storage: '+Math.round(r.damStoragePct)+'%'+(r.reservoir?.reservoir_name?' — '+r.reservoir.reservoir_name:''):'🏗️ Reservoir factor: no verified nearby storage record');\n    why.push('⚖️ Score weights: '+r.weights);\n  }"""
          if old_render not in s: raise SystemExit('render block missing')
          s=s.replace(old_render,new_render,1)
          p.write_text(s,encoding='utf-8')

      - name: Verify
        run: |
          python -m py_compile backend/main.py
          grep -q 'function calculateFloodHazardScore' index.html
          grep -q 'reservoir_status' backend/main.py
          grep -q '40% rainfall + 35% river + 25% reservoir' index.html
          echo 'Multi-factor hazard implementation verified'
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py index.html
          git diff --cached --quiet || git commit -m 'feat: add verified reservoir-aware flood hazard score'
          git rm .github/workflows/apply-multifactor-hazard.yml
          git commit -m 'chore: remove one-time multifactor workflow'
          git push
